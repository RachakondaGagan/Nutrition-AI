<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NutritionX AI — Personal Nutrition & Fitness</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="theme-color" content="#0b100d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* ─── FRESH GREEN COLOR SYSTEM ─── */
    :root[data-theme="dark"] {
      --bg-base: #080d0a;
      --bg-surface: #101713;
      --bg-surface-elevated: #16201b;
      --bg-surface-hover: #1c2923;
      --bg-subtle: #213028;
      
      --border-subtle: #1e2c24;
      --border-medium: #2a3d32;
      --border-active: #10b981;
      
      --text-main: #f0fdf4;
      --text-muted: #86a794;
      --text-faint: #526f5f;
      
      /* Fresh Green Accents */
      --green-primary: #10b981; /* Emerald green */
      --green-hover: #059669;
      --green-light: #34d399;
      --green-subtle: rgba(16, 185, 129, 0.14);
      --green-glow: rgba(16, 185, 129, 0.25);
      
      /* Nutrients Palette */
      --color-cal: #10b981;   /* Fresh green */
      --color-pro: #84cc16;   /* Electric lime */
      --color-carb: #06b6d4;  /* Vibrant cyan */
      --color-fat: #f59e0b;   /* Warm golden amber */
      --color-water: #0ea5e9; /* Sky water blue */
      
      --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
      --shadow-float: 0 16px 40px -6px rgba(0, 0, 0, 0.6);
      --nav-glass: rgba(16, 23, 19, 0.88);
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg-base: #f3f8f5;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f8fbf9;
      --bg-surface-hover: #eef6f1;
      --bg-subtle: #e4efe8;
      
      --border-subtle: #dae7df;
      --border-medium: #c5dacd;
      --border-active: #059669;
      
      --text-main: #0d1f16;
      --text-muted: #4e6b5a;
      --text-faint: #819d8d;
      
      /* Fresh Green Accents */
      --green-primary: #059669;
      --green-hover: #047857;
      --green-light: #10b981;
      --green-subtle: rgba(5, 150, 105, 0.12);
      --green-glow: rgba(5, 150, 105, 0.18);
      
      /* Nutrients Palette */
      --color-cal: #059669;
      --color-pro: #65a30d;
      --color-carb: #0284c7;
      --color-fat: #d97706;
      --color-water: #0284c7;
      
      --shadow-card: 0 2px 12px -1px rgba(13, 31, 22, 0.05);
      --shadow-float: 0 16px 36px -6px rgba(13, 31, 22, 0.12);
      --nav-glass: rgba(255, 255, 255, 0.92);
      color-scheme: light;
    }

    /* ─── RESET & TYPOGRAPHY ─── */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* ─── RESPONSIVE WEBSITE LAYOUT ─── */
    .site-wrapper {
      display: flex;
      min-height: 100vh;
      max-width: 1360px;
      margin: 0 auto;
      position: relative;
    }

    /* Desktop Sidebar Nav */
    .desktop-sidebar {
      display: none;
      width: 250px;
      flex-shrink: 0;
      padding: 28px 20px;
      border-right: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 8px;
      margin-bottom: 32px;
    }
    .brand-logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--green-primary), var(--green-light));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 4px 14px var(--green-glow);
    }
    .brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0;
      color: var(--text-main);
    }

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      transition: all 0.15s ease;
    }
    .sidebar-link:hover {
      background: var(--bg-surface-hover);
      color: var(--text-main);
    }
    .sidebar-link.active {
      background: var(--green-subtle);
      color: var(--green-primary);
      border: 1px solid color-mix(in srgb, var(--green-primary) 30%, transparent);
    }
    .sidebar-link svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.2;
    }

    .sidebar-footer {
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
    }
    .user-profile-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--green-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
    }

    /* Main Content Area */
    .site-main {
      flex: 1;
      min-width: 0; /* Prevents flex blowout */
      display: flex;
      flex-direction: column;
      padding-bottom: 90px;
    }

    /* Top Sticky Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--nav-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: calc(12px + env(safe-area-inset-top, 0px)) 20px 10px;
    }
    .header-content {
      max-width: 1060px;
      margin: 0 auto;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .header-title-group h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0;
      line-height: 1.15;
    }
    .header-title-group .sub {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-icon-round {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 0;
    }
    .btn-icon-round:hover {
      color: var(--text-main);
      border-color: var(--green-primary);
      transform: scale(1.05);
    }
    .btn-icon-round:active { transform: scale(0.95); }

    /* Day Picker Strip */
    .day-selector-strip {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .day-selector-strip::-webkit-scrollbar { display: none; }
    .day-card-pill {
      flex: 1;
      min-width: 44px;
      border-radius: 12px;
      padding: 8px 4px 6px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .day-card-pill:hover {
      background: var(--bg-surface-hover);
      color: var(--text-main);
    }
    .day-card-pill .dow {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .day-card-pill .dom {
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
    }
    .day-card-pill .has-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: transparent;
    }
    .day-card-pill.has-data .has-dot { background: var(--text-faint); }
    .day-card-pill.active {
      background: var(--green-primary);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--green-glow);
    }
    .day-card-pill.active .has-dot { background: #ffffff; }

    /* Page Container */
    .page-container {
      max-width: 1060px;
      margin: 0 auto;
      width: 100%;
      padding: 20px 20px 40px;
    }

    /* ─── RESPONSIVE 2-COLUMN DASHBOARD GRID ─── */
    .dashboard-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 900px) {
      .dashboard-layout {
        grid-template-columns: 1.4fr 1fr;
      }
      .desktop-sidebar {
        display: flex;
      }
      .app-nav-dock {
        display: none !important;
      }
      .site-main {
        padding-bottom: 40px;
      }
    }

    /* ─── CARDS ─── */
    .panel-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .panel-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-action-btn {
      font-size: 13px;
      font-weight: 700;
      color: var(--green-primary);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    .panel-action-btn:hover { text-decoration: underline; }

    /* ─── GOALS 4-GRID (NO OVERFLOW EVER) ─── */
    .goals-container-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }
    @media (min-width: 600px) and (max-width: 899px) {
      .goals-container-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    @media (min-width: 1100px) {
      .goals-container-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    .goal-stat-tile {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0; /* Prevents overflow */
      overflow: hidden;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .goal-stat-tile:hover {
      border-color: var(--border-medium);
      transform: translateY(-1px);
    }
    .goal-gauge-wrap {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      position: relative;
    }
    .goal-gauge-wrap svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .goal-gauge-wrap circle {
      fill: none;
      stroke-width: 4.5;
      stroke-linecap: round;
    }
    .goal-gauge-wrap .gauge-track {
      stroke: var(--bg-subtle);
    }
    .goal-gauge-wrap .gauge-val {
      transition: stroke-dashoffset 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .goal-data-wrap {
      min-width: 0;
      flex: 1;
    }
    .goal-label-text {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .goal-main-val {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.15;
      margin-top: 1px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .goal-sub-text {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ─── HYDRATION BAR CARD ─── */
    .water-tracker-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px 16px;
      margin-top: 14px;
    }
    .water-row-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .water-track {
      height: 8px;
      background: var(--bg-subtle);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .water-fill {
      height: 100%;
      background: var(--color-water);
      border-radius: 99px;
      transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .water-quick-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-water-chip {
      flex: 1;
      min-width: 60px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.12s ease;
    }
    .btn-water-chip:hover {
      border-color: var(--color-water);
      color: var(--color-water);
    }
    .btn-water-chip:active { transform: scale(0.95); }

    /* ─── MEALS LIST & ENTRIES ─── */
    .meal-category-block {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
    }
    .meal-cat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .meal-cat-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .meal-cat-time {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-faint);
    }
    .meal-cat-title {
      font-size: 16px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .meal-cat-cal {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-muted);
    }
    .food-items-ul {
      list-style: none;
      padding: 0;
      margin: 0 0 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .food-item-entry {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.15s ease;
    }
    .food-item-entry:hover {
      border-color: var(--border-medium);
    }
    .food-info-col {
      min-width: 0;
      flex: 1;
    }
    .food-item-heading {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 2px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .food-item-subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
      margin: 0 0 5px;
    }
    .food-macros-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .macro-pill-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill-circle {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .btn-trash-item {
      background: transparent;
      border: none;
      color: var(--text-faint);
      padding: 8px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.12s;
    }
    .btn-trash-item:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    .btn-add-meal-entry {
      width: 100%;
      background: transparent;
      border: 1px dashed var(--border-subtle);
      border-radius: 12px;
      padding: 10px;
      color: var(--green-primary);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-add-meal-entry:hover {
      background: var(--green-subtle);
      border-color: var(--green-primary);
    }

    /* ─── REVIEW & HEATMAP GRID ─── */
    .period-filter-bar {
      display: flex;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 20px;
      max-width: 380px;
    }
    .btn-period-opt {
      flex: 1;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      background: transparent;
      border: none;
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-period-opt.active {
      background: var(--green-primary);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--green-glow);
    }

    .heatmap-scroll-area {
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: thin;
    }
    .consistency-heatmap-grid {
      display: grid;
      grid-template-rows: repeat(7, 15px);
      grid-auto-flow: column;
      grid-auto-columns: 15px;
      gap: 4px;
    }
    .heatmap-box-cell {
      width: 15px;
      height: 15px;
      border-radius: 3px;
      background: var(--bg-subtle);
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .heatmap-box-cell:hover {
      transform: scale(1.35);
      z-index: 10;
      box-shadow: 0 0 8px rgba(0,0,0,0.4);
    }
    .heatmap-box-cell.c-perfect { background: #10b981; }
    .heatmap-box-cell.c-good { background: #84cc16; }
    .heatmap-box-cell.c-moderate { background: #f59e0b; }

    /* ─── FLOATING ACTION BOTTOM DOCK (MOBILE) ─── */
    .app-nav-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: var(--nav-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-subtle);
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .nav-tab-button {
      background: transparent;
      border: none;
      color: var(--text-faint);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 12px;
      transition: all 0.15s ease;
      min-width: 52px;
    }
    .nav-tab-button svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.2;
    }
    .nav-tab-button:hover { color: var(--text-main); }
    .nav-tab-button.active { color: var(--green-primary); }
    .nav-tab-button:active { transform: scale(0.92); }

    .btn-fab-log {
      background: var(--green-primary);
      color: #ffffff;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--green-glow);
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
      margin: -14px 4px 0;
    }
    .btn-fab-log svg {
      width: 24px;
      height: 24px;
      stroke-width: 2.5;
    }
    .btn-fab-log:hover {
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 8px 24px var(--green-glow);
    }
    .btn-fab-log:active { transform: scale(0.94); }

    /* ─── FLOATING AI COACH ─── */
    #coach-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;

  <script>
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
    const fmt = n => Math.round(n || 0).toLocaleString();
    const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
    const today = iso(new Date());

    // ─── STATE ───
    const G = { k: 1900, p: 120, c: 210, f: 60, w: 2850, name: "Gagan", weight: 80, height: 183 };
    const S = { date: today, tab: "log", reviewPeriod: "weekly", entries: [], water: [] };
    const D = { tab: "text", text: "", meal: "breakfast", rows: [], msg: "", img: "", file: null };
    const MEALS = ["breakfast", "lunch", "dinner", "snack"];
    const ML = { breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner", snack: "Snacks" };
    const MEAL_TIMES = { breakfast: "8:00 AM", lunch: "1:30 PM", dinner: "8:00 PM", snack: "4:30 PM" };

    // ─── THEME TOGGLE ───
    function initTheme() {
      const saved = localStorage.getItem("nx-theme") || "dark";
      document.documentElement.setAttribute("data-theme", saved);
      updateThemeIcon(saved);
    }
    function toggleThemeMode() {
      const curr = document.documentElement.getAttribute("data-theme") || "dark";
      const next = curr === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("nx-theme", next);
      updateThemeIcon(next);
    }
    function updateThemeIcon(t) {
      const icon = $("#svg-theme");
      if (t === "light") {
        icon.innerHTML = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
      } else {
        icon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
      }
    }

    // ─── DAY SELECTOR STRIP ───
    function renderDayStrip() {
      const container = $("#day-bar");
      const days = [];
      for (let i = -3; i <= 3; i++) {
        days.push(addDays(S.date, i));
      }
      container.innerHTML = days.map(dStr => {
        const dt = new Date(dStr + "T12:00:00");
        const dow = dt.toLocaleDateString("en-US", { weekday: "narrow" });
        const dom = dt.getDate();
        const isActive = dStr === S.date;
        const hasData = S.entries.some(e => e.date === dStr);
        return `
          <button class="day-card-pill ${isActive ? 'active' : ''} ${hasData ? 'has-data' : ''}" onclick="selectDate('${dStr}')">
            <span class="dow">${dow}</span>
            <span class="dom">${dom}</span>
            <span class="has-dot"></span>
          </button>
        `;
      }).join("");

      const dt = new Date(S.date + "T12:00:00");
      const isToday = S.date === today;
      $("#header-date-caption").textContent = (isToday ? "Today, " : "") + dt.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " · " + G.name;
    }

    function selectDate(d) {
      S.date = d;
      renderDayStrip();
      syncFromServer();
    }

    // ─── TAB NAVIGATION ───
    function switchNav(tab) {
      S.tab = tab;
      $$(".sidebar-link").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      $$(".nav-tab-button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      const titleMap = { log: "Food Journal", review: "Review & Insights", water: "Hydration Tracker", plan: "Meal Blueprint" };
      $("#view-title").textContent = titleMap[tab] || "NutritionX";
      renderView();
    }

    // ─── CIRCULAR PROGRESS GAUGE (NEVER OVERFLOWS) ───
    function renderGauge(val, goal, col) {
      const r = 17;
      const c = 2 * Math.PI * r;
      const pct = Math.min(1, Math.max(0, goal ? val / goal : 0));
      const off = c * (1 - pct);
      return `
        <div class="goal-gauge-wrap">
          <svg viewBox="0 0 44 44">
            <circle class="gauge-track" cx="22" cy="22" r="${r}"></circle>
            <circle class="gauge-val" cx="22" cy="22" r="${r}" stroke="${col}" stroke-dasharray="${c}" stroke-dashoffset="${off}"></circle>
          </svg>
        </div>
      `;
    }

    // ─── MAIN VIEWS ───
    function renderView() {
      const v = $("#main-content-slot");
      if (S.tab === "log") v.innerHTML = viewLog();
      else if (S.tab === "review") v.innerHTML = viewReview();
      else if (S.tab === "water") v.innerHTML = viewWater();
      else if (S.tab === "plan") v.innerHTML = viewPlan();
    }

    function viewLog() {
      const dayE = S.entries.filter(e => e.date === S.date);
      const totals = dayE.reduce((acc, e) => {

    // ─── REVIEW VIEW (Daily, Weekly, Monthly + Heatmap) ───

        <div class="period-filter-bar">
          <button class="btn-period-opt ${S.reviewPeriod === 'daily' ? 'active' : ''}" onclick="setPeriod('daily')">Daily</button>

    function setPeriod(p) {
      S.reviewPeriod = p;
      renderView();
    }

    function generateHeatmapBoxes() {
      const boxes = [];
      for (let i = 83; i >= 0; i--) {
        const dStr = addDays(today, -i);
        const dayE = S.entries.filter(e => e.date === dStr);
        const k = dayE.reduce((s, e) => s + (e.k || 0), 0);
        const p = dayE.reduce((s, e) => s + (e.p || 0), 0);
        let colorClass = "";
        if (dayE.length > 0) {
          if (k >= 1700 && k <= 2050 && p >= 110) colorClass = "c-perfect";
          else if (k >= 1500) colorClass = "c-good";
          else colorClass = "c-moderate";
        }
        boxes.push(`
          <div class="heatmap-box-cell ${colorClass}"
               data-date="${dStr}" data-k="${k}" data-p="${Math.round(p)}" data-n="${dayE.length}"
               onmouseenter="onTip(event, this)" onmouseleave="offTip()"
               onclick="selectDate('${dStr}');switchNav('log')">
          </div>
        `);
      }
      return boxes.join("");
    }

    function onTip(e, el) {
      const tip = $("#heat-tip");
      const d = el.dataset.date;
      const k = el.dataset.k;
      const p = el.dataset.p;
      const n = el.dataset.n;
      tip.innerHTML = `<strong>${d}</strong><br>${n > 0 ? `${k} kcal · ${p}g Protein (${n} items)` : 'No entries'}`;
      tip.style.display = "block";
      const rect = el.getBoundingClientRect();
      tip.style.left = Math.min(window.innerWidth - 180, Math.max(10, rect.left - 60)) + "px";
      tip.style.top = (rect.top - 54) + "px";
    }
    function offTip() {
      $("#heat-tip").style.display = "none";
    }

    // ─── API & SERVER DATA SYNC ───
    async function syncFromServer() {
      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";
        const [fe, we, pr] = await Promise.all([
          fetch(`/api/food-entries?date=${S.date}`, { headers: { "x-timezone": tz } }).then(r => r.ok ? r.json() : []),
          fetch(`/api/water?date=${S.date}`, { headers: { "x-timezone": tz } }).then(r => r.ok ? r.json() : { entries: [] }),
          fetch(`/api/profile`).then(r => r.ok ? r.json() : null)
        ]);

        if (pr) {
          if (pr.calorie_target) G.k = Number(pr.calorie_target);
          if (pr.protein_target_g) G.p = Number(pr.protein_target_g);
          if (pr.carb_target_g) G.c = Number(pr.carb_target_g);
          if (pr.fat_target_g) G.f = Number(pr.fat_target_g);
          if (pr.water_target_ml) G.w = Number(pr.water_target_ml);
          if (pr.display_name) G.name = pr.display_name;
        }

        if (Array.isArray(fe)) {
          const mapped = fe.map(e => ({
            id: e.id,
            date: e.local_date,
            meal: e.meal_type,
            name: e.name,
            qty: e.quantity,
            unit: e.unit,
            k: e.calories_kcal,
            p: e.protein_g,
            c: e.carbs_g,
            f: e.fat_g,
            src: e.source || "AI Analysis"
          }));
          S.entries = [...S.entries.filter(e => e.date !== S.date), ...mapped];
        }

        const wList = we.entries || [];
        if (Array.isArray(wList)) {
          const mappedW = wList.map(w => ({
            id: w.id,
            date: w.local_date,
            ml: w.amount_ml,
            t: w.drunk_at ? w.drunk_at.slice(11, 16) : ""
          }));
          S.water = [...S.water.filter(w => w.date !== S.date), ...mappedW];
        }

        renderDayStrip();
        renderView();
      } catch (e) {}
    }

    // ─── ACTIONS ───
    async function addWater(ml) {
      const nid = Math.random().toString(36).slice(2);
      const tStr = new Date().toTimeString().slice(0, 5);
      S.water.push({ id: nid, date: S.date, ml, t: tStr });
      renderView();
      toast(`+${ml} ml logged 💧`);

      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";
        await fetch("/api/water", {
          method: "POST",
          headers: { "content-type": "application/json", "x-timezone": tz },
          body: JSON.stringify({ amount_ml: ml, drunk_at: `${S.date}T${tStr}:00`, client_request_id: nid })
        });
      } catch (e) {}
    }

    async function deleteWaterLog(id) {
      S.water = S.water.filter(w => w.id !== id);
      renderView();
      fetch(`/api/water/${id}`, { method: "DELETE" }).catch(() => {});
    }

    async function deleteFoodEntry(id) {
      S.entries = S.entries.filter(e => e.id !== id);
      renderView();
      toast("Meal removed");
      fetch(`/api/food-entries/${id}`, { method: "DELETE" }).catch(() => {});

            <input type="file" id="inp-photo-upload" accept="image/*" style="display:none" onchange="onPhotoSelected(event)">
            <div style="font-size:32px">📸</div>
            <div style="font-weight:700;font-size:14px;margin-top:6px">Tap to upload meal photo</div>
            <div style="font-size:12px;color:var(--text-muted)">AI Vision recognizes Indian dishes & portion sizes</div>
          </div>
          ${D.img ? `<img src="${D.img}" style="width:100%;border-radius:14px;margin-top:12px;max-height:180px;object-fit:cover">` : ''}
          ${D.img ? `<button class="btn-green-submit" onclick="runPhotoEstimation()">⚡ Analyze Photo with Vision AI</button>` : ''}
          ${D.msg ? `<p style="font-size:12.5px;color:var(--green-primary);margin-top:8px">${esc(D.msg)}</p>` : ''}
          ${renderEstimatedRows()}
        `;
      }
    }

    function renderEstimatedRows() {
      if (!D.rows.length) return "";
      return `
        <div style="margin-top:14px;border-top:1px solid var(--border-subtle);padding-top:12px">
          <div style="font-weight:800;font-size:13px;margin-bottom:8px">Identified Items</div>
          ${D.rows.map((r, i) => `
            <div style="background:var(--bg-surface-elevated);padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:12.5px">
              <div style="font-weight:700">${esc(r.name)} (${r.qty} ${esc(r.unit)})</div>
              <div style="color:var(--text-muted);font-size:11.5px">${Math.round(r.k)} kcal · ${Math.round(r.p)}g P · ${Math.round(r.c)}g C · ${Math.round(r.f)}g F</div>
            </div>
          `).join("")}
          <button class="btn-green-submit" onclick="commitEstimatedItems()">Confirm & Save to Journal</button>
        </div>
      `;
    }

    async function runTextEstimation() {
      const txt = $("#txt-log-desc").value.trim();
      const meal = $("#sel-log-meal").value;
      if (!txt) return;
      D.text = txt;
      D.meal = meal;
      D.msg = "Analyzing with AI...";
      renderLogModalContent();

      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";
        const res = await fetch("/api/nutrition/analyze-text", {
          method: "POST",
          headers: { "content-type": "application/json", "x-timezone": tz },
          body: JSON.stringify({ description: txt, meal_type: meal })
        });
        const j = await res.json();
        if (j.analysis?.items?.length) {
          D.rows = j.analysis.items.map(i => ({
            name: i.name,
            qty: i.quantity,
            unit: i.unit,
            k: i.calories_kcal || 0,
            p: i.protein_g || 0,
            c: i.carbs_g || 0,
            f: i.fat_g || 0
          }));
          D.msg = "";
        } else {
          D.msg = "No foods recognized. Try specific items (e.g. 3 eggs, 2 rotis).";
        }
      } catch (e) {
        D.msg = "Error connecting to AI service.";
      }
      renderLogModalContent();
    }

    function onPhotoSelected(e) {
      const f = e.target.files[0];
      if (!f) return;
      D.file = f;
      D.img = URL.createObjectURL(f);
      renderLogModalContent();
    }

    async function runPhotoEstimation() {
      if (!D.file) return;
      D.msg = "Vision AI analyzing meal photo...";
      renderLogModalContent();
      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";
        const res = await fetch("/api/nutrition/analyze-image", {
          method: "POST",
          headers: { "content-type": D.file.type, "x-timezone": tz },
          body: D.file
        });
        const j = await res.json();
        if (j.analysis?.items?.length) {
          D.rows = j.analysis.items.map(i => ({
            name: i.name,
            qty: i.quantity,
            unit: i.unit,
            k: i.calories_kcal || 0,
            p: i.protein_g || 0,
            c: i.carbs_g || 0,
            f: i.fat_g || 0
          }));
          D.msg = "";
        } else {
          D.msg = "No foods clearly recognized. Try text prompt.";
        }
      } catch (e) {
        D.msg = "Error analyzing image.";
      }
      renderLogModalContent();
    }

    async function commitEstimatedItems() {
      const tStr = new Date().toTimeString().slice(0, 5);
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";

      for (const r of D.rows) {
        const nid = Math.random().toString(36).slice(2);
        const item = {
          id: nid,
          date: S.date,
          meal: D.meal,
          name: r.name,
          qty: r.qty,
          unit: r.unit,
          k: r.k,
          p: r.p,
          c: r.c,
          f: r.f,
          src: "AI estimate, confirmed"
        };
        S.entries.push(item);
        fetch("/api/food-entries", {
          method: "POST",
          headers: { "content-type": "application/json", "x-timezone": tz },
          body: JSON.stringify({
            name: item.name,
            quantity: item.qty,
            unit: item.unit,
            meal_type: item.meal,
            calories_kcal: item.k,
            protein_g: item.p,
            carbs_g: item.c,
            fat_g: item.f,
            eaten_at: `${S.date}T${tStr}:00`,
            source: item.src,
            client_request_id: nid
          })
        }).catch(() => {});
      }

      $("#dlg-meal-log").close();
      toast("Meal saved to " + ML[D.meal]);
      renderView();
      renderDayStrip();
    }

    // ─── GOALS SETTINGS ───
    function openGoalsModal() {
      $("#t-cal").value = G.k;
      $("#t-pro").value = G.p;
      $("#t-carb").value = G.c;
      $("#t-fat").value = G.f;
      $("#t-water").value = G.w;
      $("#dlg-target-settings").showModal();
    }

    async function submitGoalsSave() {
      G.k = Number($("#t-cal").value) || G.k;
      G.p = Number($("#t-pro").value) || G.p;
      G.c = Number($("#t-carb").value) || G.c;
      G.f = Number($("#t-fat").value) || G.f;
      G.w = Number($("#t-water").value) || G.w;

      fetch("/api/profile", {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          calorie_target: G.k,
          protein_target_g: G.p,
          carb_target_g: G.c,
          fat_target_g: G.f,
          water_target_ml: G.w
        })
      }).catch(() => {});

      $("#dlg-target-settings").close();
      toast("Targets updated!");
      renderView();
    }

    // ─── AI COACH ───
    let coachOpen = false;
    const coachChatHistory = [
      { role: "assistant", content: "Hey Gagan! I'm your NutritionX Coach. I know your 1,900 kcal target, 120g protein goal, Indian vegetarian + eggs diet, and what you've logged today. What can I help you with?" }
    ];

    function toggleCoachChat() {
      coachOpen = !coachOpen;
      const p = $("#coach-panel");
      p.hidden = !coachOpen;
      if (coachOpen) renderCoachMessages();
    }

    function renderCoachMessages() {
      const b = $("#coach-msgs");
      b.innerHTML = coachChatHistory.map(m => `
        <div class="msg-bubble ${m.role === 'user' ? 'msg-user' : 'msg-bot'}">
          ${m.role === 'user' ? esc(m.content) : m.content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')}
        </div>
      `).join("");
      b.scrollTop = b.scrollHeight;
    }

    async function submitCoachMsg(e) {
      e.preventDefault();
      const inp = $("#coach-input");
      const msg = inp.value.trim();
      if (!msg) return;
      inp.value = "";
      coachChatHistory.push({ role: "user", content: msg });
      renderCoachMessages();

      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "content-type": "application/json", "x-timezone": tz },
          body: JSON.stringify({ message: msg, history: coachChatHistory.slice(-5) })
        });
        const data = await res.json();
        coachChatHistory.push({ role: "assistant", content: data.reply || "Keep crushing your 120g protein & hydration goals Gagan! 💪" });
      } catch (err) {
        coachChatHistory.push({ role: "assistant", content: "Couldn't reach coach right now. Keep your protein high with eggs, dal, and curd!" });
      }
      renderCoachMessages();
    }

    function toast(msg) {
      const t = $("#site-toast");
      t.textContent = msg;
      t.classList.add("visible");
      setTimeout(() => t.classList.remove("visible"), 2200);
    }

    // ─── INIT ───
    initTheme();
    renderDayStrip();
    renderView();
    syncFromServer();
  </script>
</body>
</html>
