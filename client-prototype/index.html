<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>NutritionX AI — Personal Fitness Journal</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NutritionX">
  <meta name="theme-color" content="#090a0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ─── THEME PALETTES ─── */
    :root[data-theme="dark"] {
      --bg-page: #090a0f;
      --bg-surface: #12141c;
      --bg-surface-elevated: #1a1d28;
      --bg-subtle: #222634;
      --border-subtle: #242838;
      --border-focus: #ff6b35;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      
      --accent-main: #ff6b35; /* MacroFactor energetic warm coral */
      --accent-main-hover: #ff7f4d;
      --accent-main-subtle: rgba(255, 107, 53, 0.15);
      
      --color-cal: #ff5722;
      --color-carb: #0ea5e9;
      --color-fat: #10b981;
      --color-pro: #f97316;
      --color-water: #06b6d4;
      --color-ai: #8b5cf6;
      
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
      --shadow-md: 0 8px 24px -4px rgba(0,0,0,0.5);
      --shadow-float: 0 16px 36px -6px rgba(0,0,0,0.65);
      --glass-nav: rgba(18, 20, 28, 0.85);
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg-page: #f4f5f8;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #fbfbfd;
      --bg-subtle: #f0f2f6;
      --border-subtle: #e5e8ef;
      --border-focus: #ff5722;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-tertiary: #94a3b8;
      
      --accent-main: #ff5722;
      --accent-main-hover: #f4511e;
      --accent-main-subtle: rgba(255, 87, 34, 0.12);
      
      --color-cal: #ff5722;
      --color-carb: #0284c7;
      --color-fat: #059669;
      --color-pro: #ea580c;
      --color-water: #0891b2;
      --color-ai: #7c3aed;
      
      --shadow-sm: 0 2px 6px rgba(0,0,0,0.03);
      --shadow-md: 0 8px 24px -4px rgba(15, 23, 42, 0.07);
      --shadow-float: 0 16px 36px -6px rgba(15, 23, 42, 0.12);
      --glass-nav: rgba(255, 255, 255, 0.90);
      color-scheme: light;
    }

    /* ─── RESET & BASE ─── */
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      min-height: 100vh;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── APP SHELL CONTAINER ─── */
    .app-viewport {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: var(--bg-page);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 60px rgba(0,0,0,0.12);
    }

    @media (min-width: 768px) {
      body { background-color: #050608; }
      .app-viewport {
        border-left: 1px solid var(--border-subtle);
        border-right: 1px solid var(--border-subtle);
      }
    }

    /* ─── TOP HEADER ─── */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--glass-nav);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 8px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .app-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .app-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0;
      line-height: 1.1;
    }
    .app-date-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      margin-top: 2px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-icon-subtle {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 0;
    }
    .btn-icon-subtle:hover {
      color: var(--text-primary);
      border-color: var(--text-tertiary);
      transform: scale(1.05);
    }
    .btn-icon-subtle:active { transform: scale(0.95); }

    /* ─── DAY PICKER STRIP (Screen 3 style) ─── */
    .day-strip {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .day-strip::-webkit-scrollbar { display: none; }
    .day-pill {
      flex: 1;
      min-width: 44px;
      border-radius: 14px;
      padding: 8px 4px 6px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .day-pill:hover { background: var(--bg-surface-elevated); }
    .day-pill .dow {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .day-pill .dom {
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
    }
    .day-pill .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: transparent;
    }
    .day-pill.has-logs .dot { background: var(--text-tertiary); }
    .day-pill.active {
      background: var(--accent-main);
      color: #ffffff;
      box-shadow: 0 4px 12px var(--accent-main-subtle);
    }
    .day-pill.active .dot { background: #ffffff; }

    /* ─── MAIN SCROLL CONTENT ─── */
    .app-main {
      flex: 1;
      padding: 16px 16px 120px;
      overflow-y: auto;
    }

    /* ─── CARDS ─── */
    .card-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-heading {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-action-text {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-main);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    .card-action-text:hover { text-decoration: underline; }

    /* ─── GOALS 4-GRID (MacroFactor Style) ─── */
    .goals-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 440px) {
      .goals-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .goal-tile {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 12px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }
    .goal-gauge {
      width: 44px;
      height: 44px;
      position: relative;
      flex-shrink: 0;
    }
    .goal-gauge svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }
    .goal-gauge circle {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
    }
    .goal-gauge .bg-circle {
      stroke: var(--bg-subtle);
    }
    .goal-gauge .val-circle {
      transition: stroke-dashoffset 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .goal-tile-info {
      min-width: 0;
    }
    .goal-tile-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .goal-tile-val {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.15;
      margin-top: 1px;
      white-space: nowrap;
    }
    .goal-tile-sub {
      font-size: 10.5px;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    /* ─── WATER QUICK BAR ─── */
    .water-bar-wrap {
      margin-top: 14px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 12px 14px;
    }
    .water-bar-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .water-progress-track {
      height: 8px;
      background: var(--bg-subtle);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .water-progress-fill {
      height: 100%;
      background: var(--color-water);
      border-radius: 99px;
      transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .water-pills-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .water-pill-btn {
      flex: 1;
      min-width: 60px;
      padding: 6px 8px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      color: var(--text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.12s ease;
    }
    .water-pill-btn:hover {
      border-color: var(--color-water);
      color: var(--color-water);
    }
    .water-pill-btn:active { transform: scale(0.96); }

    /* ─── MEAL SECTIONS & FOOD ITEMS ─── */
    .meal-block {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .meal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .meal-title-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .meal-time {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-tertiary);
    }
    .meal-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .meal-cals {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-secondary);
    }
    .food-item-list {
      list-style: none;
      padding: 0;
      margin: 0 0 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .food-item-row {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.15s ease;
    }
    .food-item-row:hover {
      border-color: var(--text-tertiary);
    }
    .food-left {
      min-width: 0;
      flex: 1;
    }
    .food-name-txt {
      font-size: 13.5px;
      font-weight: 700;
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .food-qty-txt {
      font-size: 11.5px;
      color: var(--text-secondary);
      margin: 0 0 4px;
    }
    .macro-dots-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .macro-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .dot-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-cal { background: var(--color-cal); }
    .dot-pro { background: var(--color-pro); }
    .dot-carb { background: var(--color-carb); }
    .dot-fat { background: var(--color-fat); }
    
    .food-right-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 8px;
    }
    .btn-delete-item {
      background: transparent;
      border: none;
      color: var(--text-tertiary);
      padding: 6px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.12s;
    }
    .btn-delete-item:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    .btn-add-food-slot {
      width: 100%;
      background: transparent;
      border: 1px dashed var(--border-subtle);
      border-radius: 12px;
      padding: 9px;
      color: var(--accent-main);
      font-size: 12.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-add-food-slot:hover {
      background: var(--accent-main-subtle);
      border-color: var(--accent-main);
    }

    /* ─── EMPTY STATE ─── */
    .empty-day-banner {
      background: var(--bg-surface);
      border: 1px dashed var(--border-subtle);
      border-radius: 20px;
      padding: 36px 20px;
      text-align: center;
      margin-top: 10px;
    }
    .empty-icon {
      font-size: 38px;
      margin-bottom: 8px;
    }
    .empty-day-banner h3 {
      font-size: 16px;
      font-weight: 800;
      margin: 0 0 6px;
    }
    .empty-day-banner p {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0 0 16px;
    }

    /* ─── REVIEW TAB & CALENDAR HEATMAP ─── */
    .review-tabs-bar {
      display: flex;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .review-tab-btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      background: transparent;
      border: none;
      border-radius: 10px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .review-tab-btn.active {
      background: var(--accent-main);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--accent-main-subtle);
    }

    .heatmap-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .heatmap-grid-scroll {
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
    }
    .heatmap-grid {
      display: grid;
      grid-template-rows: repeat(7, 14px);
      grid-auto-flow: column;
      grid-auto-columns: 14px;
      gap: 4px;
    }
    .heatmap-cell {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background: var(--bg-subtle);
      cursor: pointer;
      position: relative;
      transition: transform 0.1s ease;
    }
    .heatmap-cell:hover {
      transform: scale(1.3);
      z-index: 10;
      box-shadow: 0 0 6px rgba(0,0,0,0.4);
    }
    .heatmap-cell.status-perfect { background: #10b981; }
    .heatmap-cell.status-good { background: #84cc16; }
    .heatmap-cell.status-under { background: #f59e0b; }
    .heatmap-cell.status-over { background: #f97316; }

    .heatmap-tooltip {
      position: fixed;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      pointer-events: none;
      z-index: 100;
      display: none;
      box-shadow: var(--shadow-md);
      white-space: nowrap;
    }

    /* ─── FLOATING BOTTOM NAVIGATION DOCK ─── */
    .app-nav-dock {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, 100%);
      z-index: 50;
      background: var(--glass-nav);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-subtle);
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .nav-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-tertiary);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 12px;
      transition: color 0.15s ease, transform 0.12s ease;
      min-width: 52px;
    }
    .nav-tab-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.2;
    }
    .nav-tab-btn:hover { color: var(--text-primary); }
    .nav-tab-btn.active { color: var(--accent-main); }
    .nav-tab-btn:active { transform: scale(0.92); }

    /* Centered Plus Action Button */
    .nav-action-fab {
      background: var(--accent-main);
      color: #ffffff;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-main-subtle);
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.18s ease;
      margin: -14px 4px 0;
    }
    .nav-action-fab svg {
      width: 24px;
      height: 24px;
      stroke-width: 2.5;
    }
    .nav-action-fab:hover {
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 8px 24px var(--accent-main-subtle);
    }
    .nav-action-fab:active { transform: scale(0.94); }

    /* ─── FLOATING AI COACH BUBBLE ─── */
    #chat-fab {
      position: fixed;
      bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      right: 18px;
      z-index: 55;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--color-ai);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #chat-fab:hover { transform: scale(1.1); }
    #chat-fab:active { transform: scale(0.95); }

    #chat-panel {
      position: fixed;
      bottom: calc(130px + env(safe-area-inset-bottom, 0px));
      right: 18px;
      width: min(390px, calc(100vw - 36px));
      max-height: calc(100vh - 210px);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      box-shadow: var(--shadow-float);
      z-index: 60;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform-origin: bottom right;
    }
    #chat-panel[hidden] {
      opacity: 0;
      transform: scale(0.92) translateY(12px);
      pointer-events: none;
      display: flex !important;
    }
    .chat-header {
      padding: 12px 16px;
      background: var(--bg-surface-elevated);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-header h4 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chat-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .c-msg {
      max-width: 86%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .c-user {
      align-self: flex-end;
      background: var(--accent-main);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .c-bot {
      align-self: flex-start;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }
    .c-bot strong { color: var(--accent-main); font-weight: 700; }
    .c-bot ul, .c-bot ol { margin: 6px 0; padding-left: 18px; }
    .chat-input-row {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-surface);
    }
    .chat-input-row input {
      flex: 1;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 13px;
    }
    .chat-input-row button {
      background: var(--color-ai);
      border: none;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    /* ─── MODALS & DIALOGS ─── */
    dialog {
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-primary);
      border-radius: 24px;
      padding: 22px;
      width: min(480px, calc(100vw - 32px));
      box-shadow: var(--shadow-float);
    }
    dialog::backdrop {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
    }
    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .dialog-header h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }
    .btn-pill-primary {
      background: var(--accent-main);
      color: #ffffff;
      border: none;
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      width: 100%;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-top: 14px;
    }
    .btn-pill-primary:hover {
      background: var(--accent-main-hover);
    }

    /* ─── TOAST ─── */
    #toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--accent-main);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app-viewport">
    <!-- TOP HEADER -->
    <header class="app-header">
      <div class="header-row">
        <div class="app-brand">
          <div>
            <h1 class="app-title" id="page-title">Food Log</h1>
            <div class="app-date-sub" id="header-date-sub">Today · Gagan</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-icon-subtle" onclick="toggleTheme()" title="Toggle Light / Dark mode" aria-label="Toggle theme" id="theme-btn">
            <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <button class="btn-icon-subtle" onclick="openSettingsDialog()" title="Edit personal goals" aria-label="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </button>
        </div>
      </div>

      <!-- HORIZONTAL DAY STRIP -->
      <div class="day-strip" id="day-strip"></div>
    </header>

    <!-- MAIN SCROLLABLE VIEW -->
    <main class="app-main" id="app-view"></main>

    <!-- BOTTOM FLOATING APP NAVIGATION DOCK -->
    <nav class="app-nav-dock">
      <button class="nav-tab-btn active" data-tab="log" onclick="switchTab('log')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>Log</span>
      </button>

      <button class="nav-tab-btn" data-tab="review" onclick="switchTab('review')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 20V10"></path><path d="M12 20V4"></path><path d="M6 20v-6"></path></svg>
        <span>Review</span>
      </button>

      <!-- Center Plus Button -->
      <button class="nav-action-fab" onclick="openLogDialog()" aria-label="Add meal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>

      <button class="nav-tab-btn" data-tab="water" onclick="switchTab('water')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
        <span>Water</span>
      </button>

      <button class="nav-tab-btn" data-tab="plan" onclick="switchTab('plan')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span>Plan</span>
      </button>
    </nav>
  </div>

  <!-- FLOATING AI COACH BUBBLE -->
  <button id="chat-fab" onclick="toggleChat()" aria-label="Open AI Nutrition Coach">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
  </button>

  <div id="chat-panel" hidden>
    <div class="chat-header">
      <h4><span>⚡</span> NutritionX AI Coach</h4>
      <button class="btn-icon-subtle" onclick="toggleChat()" style="width:28px;height:28px">✕</button>
    </div>
    <div class="chat-msgs" id="chat-msgs"></div>
    <form class="chat-input-row" onsubmit="handleChatSubmit(event)">
      <input id="chat-inp" placeholder="Ask coach (e.g. 25g protein at canteen)..." autocomplete="off">
      <button type="submit">Ask</button>
    </form>
  </div>

  <!-- TOOLTIP FOR HEATMAP -->
  <div id="heatmap-tooltip" class="heatmap-tooltip"></div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast"></div>

  <!-- LOG FOOD MODAL -->
  <dialog id="dlg-food">
    <div class="dialog-header">
      <h3>Log Meal</h3>
      <button class="btn-icon-subtle" onclick="$('#dlg-food').close()">✕</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button id="tab-log-text" class="btn-pill-primary" style="margin:0;padding:8px" onclick="setLogTab('text')">Text / Prompt</button>
      <button id="tab-log-photo" class="btn-pill-primary" style="margin:0;padding:8px;background:var(--bg-subtle);color:var(--text-primary)" onclick="setLogTab('photo')">Scan Photo</button>
    </div>
    <div id="log-body"></div>
  </dialog>

  <!-- TARGETS SETTINGS MODAL -->
  <dialog id="dlg-settings">
    <div class="dialog-header">
      <h3>Personal Targets — Gagan</h3>
      <button class="btn-icon-subtle" onclick="$('#dlg-settings').close()">✕</button>
    </div>
    <div style="display:grid;gap:12px">
      <label style="font-size:12px;font-weight:700">Daily Calories (kcal)<input id="inp-cal" type="number" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-surface-elevated);color:var(--text-primary);margin-top:4px"></label>
      <label style="font-size:12px;font-weight:700">Protein Target (g)<input id="inp-pro" type="number" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-surface-elevated);color:var(--text-primary);margin-top:4px"></label>
      <label style="font-size:12px;font-weight:700">Carbs Target (g)<input id="inp-carb" type="number" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-surface-elevated);color:var(--text-primary);margin-top:4px"></label>
      <label style="font-size:12px;font-weight:700">Fat Target (g)<input id="inp-fat" type="number" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-surface-elevated);color:var(--text-primary);margin-top:4px"></label>
      <label style="font-size:12px;font-weight:700">Water Target (ml)<input id="inp-water" type="number" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-surface-elevated);color:var(--text-primary);margin-top:4px"></label>
      <button class="btn-pill-primary" onclick="savePersonalTargets()">Save Targets</button>
    </div>
  </dialog>

  <script>
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
    const fmt = n => Math.round(n || 0).toLocaleString();
    const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
    const today = iso(new Date());

    // ─── STATE ───
    const G = { k: 1900, p: 120, c: 210, f: 60, w: 2850, name: "Gagan", weight: 80, height: 183 };
    const S = { date: today, tab: "log", reviewPeriod: "weekly", entries: [], water: [], history: [] };
    const D = { tab: "text", text: "", meal: "breakfast", rows: [], msg: "", img: "", file: null };
    const MEALS = ["breakfast", "lunch", "dinner", "snack"];
    const ML = { breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner", snack: "Snacks" };
    const MEAL_TIMES = { breakfast: "8:30 AM", lunch: "1:30 PM", dinner: "8:15 PM", snack: "4:30 PM" };

    // ─── THEME TOGGLE ───
    function initTheme() {
      const saved = localStorage.getItem("nx-theme") || "dark";
      document.documentElement.setAttribute("data-theme", saved);
      updateThemeIcon(saved);
    }
    function toggleTheme() {
      const curr = document.documentElement.getAttribute("data-theme") || "dark";
      const next = curr === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("nx-theme", next);
      updateThemeIcon(next);
    }
    function updateThemeIcon(t) {
      const icon = $("#theme-icon");
      if (t === "light") {
        icon.innerHTML = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
      } else {
        icon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
      }
    }

    // ─── DAY STRIP RENDERER ───
    function renderDayStrip() {
      const container = $("#day-strip");
      const d = new Date(S.date + "T12:00:00");
      const days = [];
      for (let i = -3; i <= 3; i++) {
        const curDate = addDays(S.date, i);
        days.push(curDate);
      }
      container.innerHTML = days.map(dayStr => {
        const dt = new Date(dayStr + "T12:00:00");
        const dow = dt.toLocaleDateString("en-US", { weekday: "narrow" });
        const dom = dt.getDate();
        const isActive = dayStr === S.date;
        const hasLogs = S.entries.some(e => e.date === dayStr);
        return `
          <button class="day-pill ${isActive ? 'active' : ''} ${hasLogs ? 'has-logs' : ''}" onclick="selectDate('${dayStr}')">
            <span class="dow">${dow}</span>
            <span class="dom">${dom}</span>
            <span class="dot"></span>
          </button>
        `;
      }).join("");

      const dateObj = new Date(S.date + "T12:00:00");
      const isToday = S.date === today;
      $("#header-date-sub").textContent = (isToday ? "Today, " : "") + dateObj.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " · " + G.name;
    }

    function selectDate(d) {
      S.date = d;
      renderDayStrip();
      syncFromServer();
    }

    // ─── TAB SWITCHER ───
    function switchTab(tab) {
      S.tab = tab;
      $$(".nav-tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      const titleMap = { log: "Food Log", review: "Review & Insights", water: "Hydration", plan: "Meal Blueprint" };
      $("#page-title").textContent = titleMap[tab] || "NutritionX";
      renderMainView();
    }

    // ─── MINI PROGRESS GAUGE (Circular) ───
    function miniGauge(val, target, color) {
      const r = 17;
      const c = 2 * Math.PI * r; // ~106.8
      const pct = Math.min(1, Math.max(0, target ? val / target : 0));
      const offset = c * (1 - pct);
      return `
        <div class="goal-gauge">
          <svg viewBox="0 0 44 44">
            <circle class="bg-circle" cx="22" cy="22" r="${r}"></circle>
            <circle class="val-circle" cx="22" cy="22" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
          </svg>
        </div>
      `;
    }

    // ─── VIEWS ───
    function renderMainView() {
      const v = $("#app-view");
      if (S.tab === "log") v.innerHTML = viewLog();
      else if (S.tab === "review") v.innerHTML = viewReview();
      else if (S.tab === "water") v.innerHTML = viewWater();
      else if (S.tab === "plan") v.innerHTML = viewPlan();
    }

    // ─── FOOD LOG VIEW (Like screen 3) ───
    function viewLog() {
      const dayEntries = S.entries.filter(e => e.date === S.date);
      const totals = dayEntries.reduce((acc, e) => {
        acc.k += (e.k || 0); acc.p += (e.p || 0); acc.c += (e.c || 0); acc.f += (e.f || 0);
        return acc;
      }, { k: 0, p: 0, c: 0, f: 0 });

      const dayWater = S.water.filter(w => w.date === S.date).reduce((a, b) => a + b.ml, 0);

      const kRem = G.k - totals.k;
      const pRem = G.p - totals.p;
      const cRem = G.c - totals.c;
      const fRem = G.f - totals.f;

      return `
        <!-- GOALS 4-GRID -->
        <section class="card-box">
          <div class="card-header-row">
            <h2 class="card-heading">Goals</h2>
            <button class="card-action-text" onclick="openSettingsDialog()">Edit</button>
          </div>
          <div class="goals-grid">
            <div class="goal-tile">
              ${miniGauge(totals.k, G.k, "var(--color-cal)")}
              <div class="goal-tile-info">
                <div class="goal-tile-label">Calories</div>
                <div class="goal-tile-val">${fmt(totals.k)}</div>
                <div class="goal-tile-sub">${kRem >= 0 ? fmt(kRem) + ' under' : fmt(Math.abs(kRem)) + ' over'}</div>
              </div>
            </div>

            <div class="goal-tile">
              ${miniGauge(totals.p, G.p, "var(--color-pro)")}
              <div class="goal-tile-info">
                <div class="goal-tile-label">Protein</div>
                <div class="goal-tile-val">${Math.round(totals.p)}g</div>
                <div class="goal-tile-sub">${pRem >= 0 ? Math.round(pRem) + 'g under' : 'Goal met!'}</div>
              </div>
            </div>

            <div class="goal-tile">
              ${miniGauge(totals.c, G.c, "var(--color-carb)")}
              <div class="goal-tile-info">
                <div class="goal-tile-label">Carbs</div>
                <div class="goal-tile-val">${Math.round(totals.c)}g</div>
                <div class="goal-tile-sub">${cRem >= 0 ? Math.round(cRem) + 'g under' : 'Met'}</div>
              </div>
            </div>

            <div class="goal-tile">
              ${miniGauge(totals.f, G.f, "var(--color-fat)")}
              <div class="goal-tile-info">
                <div class="goal-tile-label">Fat</div>
                <div class="goal-tile-val">${Math.round(totals.f)}g</div>
                <div class="goal-tile-sub">${fRem >= 0 ? Math.round(fRem) + 'g under' : 'Met'}</div>
              </div>
            </div>
          </div>

          <!-- MINI WATER PROGRESS -->
          <div class="water-bar-wrap">
            <div class="water-bar-top">
              <span>💧 Hydration: ${fmt(dayWater)} / ${fmt(G.w)} ml</span>
              <span style="color:var(--color-water)">${Math.round(Math.min(100, (dayWater/G.w)*100))}%</span>
            </div>
            <div class="water-progress-track">
              <div class="water-progress-fill" style="width: ${Math.min(100, (dayWater/G.w)*100)}%"></div>
            </div>
            <div class="water-pills-row">
              <button class="water-pill-btn" onclick="quickAddWater(150)">+150ml</button>
              <button class="water-pill-btn" onclick="quickAddWater(250)">+250ml</button>
              <button class="water-pill-btn" onclick="quickAddWater(350)">+350ml</button>
              <button class="water-pill-btn" onclick="quickAddWater(500)">+500ml</button>
            </div>
          </div>
        </section>

        <!-- MEALS SECTIONS -->
        ${MEALS.map(m => {
          const mEntries = dayEntries.filter(e => e.meal === m);
          const mCals = mEntries.reduce((s, e) => s + (e.k || 0), 0);
          return `
            <div class="meal-block">
              <div class="meal-top">
                <div class="meal-title-group">
                  <span class="meal-time">${MEAL_TIMES[m]}</span>
                  <h3 class="meal-name">${ML[m]}</h3>
                </div>
                <div class="meal-cals">${mCals ? fmt(mCals) + ' kcal' : ''}</div>
              </div>

              ${mEntries.length ? `
                <ul class="food-item-list">
                  ${mEntries.map(e => `
                    <li class="food-item-row">
                      <div class="food-left">
                        <div class="food-name-txt">${esc(e.name)}</div>
                        <div class="food-qty-txt">${e.qty} ${esc(e.unit)} · ${esc(e.src || 'AI Analysis')}</div>
                        <div class="macro-dots-row">
                          <span class="macro-tag"><span class="dot-indicator dot-cal"></span> ${e.k ? fmt(e.k) : '—'}</span>
                          <span class="macro-tag"><span class="dot-indicator dot-pro"></span> ${e.p ? Math.round(e.p) + 'g' : '—'}</span>
                          <span class="macro-tag"><span class="dot-indicator dot-carb"></span> ${e.c ? Math.round(e.c) + 'g' : '—'}</span>
                          <span class="macro-tag"><span class="dot-indicator dot-fat"></span> ${e.f ? Math.round(e.f) + 'g' : '—'}</span>
                        </div>
                      </div>
                      <div class="food-right-actions">
                        <button class="btn-delete-item" onclick="deleteEntry('${e.id}')" title="Delete">✕</button>
                      </div>
                    </li>
                  `).join("")}
                </ul>
              ` : ''}

              <button class="btn-add-food-slot" onclick="openLogDialogForMeal('${m}')">
                + Add to ${ML[m]}
              </button>
            </div>
          `;
        }).join("")}

        ${!dayEntries.length ? `
          <div class="empty-day-banner">
            <div class="empty-icon">🥗</div>
            <h3>No meals logged for this day</h3>
            <p>Track your meals to stay on target with your 120g protein & 1,900 kcal goal.</p>
            <button class="btn-pill-primary" style="max-width:200px;margin:0 auto" onclick="openLogDialog()">Log Food</button>
          </div>
        ` : ''}
      `;
    }

    // ─── REVIEW VIEW (Daily, Weekly, Monthly + Calendar Heatmap Grid) ───
    function viewReview() {
      return `
        <!-- PERIOD TABS -->
        <div class="review-tabs-bar">
          <button class="review-tab-btn ${S.reviewPeriod === 'daily' ? 'active' : ''}" onclick="setReviewPeriod('daily')">Daily</button>
          <button class="review-tab-btn ${S.reviewPeriod === 'weekly' ? 'active' : ''}" onclick="setReviewPeriod('weekly')">Weekly</button>
          <button class="review-tab-btn ${S.reviewPeriod === 'monthly' ? 'active' : ''}" onclick="setReviewPeriod('monthly')">Monthly</button>
        </div>

        <!-- 84-DAY ACTIVITY CALENDAR HEATMAP -->
        <div class="heatmap-card">
          <div class="card-header-row">
            <h2 class="card-heading">📅 Consistency Heatmap (12 Weeks)</h2>
            <span style="font-size:11px;color:var(--text-tertiary)">Hover / tap a box</span>
          </div>
          <div class="heatmap-grid-scroll">

    }

    function setReviewPeriod(p) {
      S.reviewPeriod = p;
      renderMainView();
    }

    // ─── HEATMAP GENERATOR (12 WEEKS = 84 DAYS) ───
    function renderHeatmapGrid() {
      const cells = [];
      const totalDays = 84;
      for (let i = totalDays - 1; i >= 0; i--) {
        const dStr = addDays(today, -i);
        const dayE = S.entries.filter(e => e.date === dStr);
        const dayCals = dayE.reduce((s, e) => s + (e.k || 0), 0);
        const dayPro = dayE.reduce((s, e) => s + (e.p || 0), 0);
        let statusClass = "";
        if (dayE.length > 0) {
          if (dayCals >= 1700 && dayCals <= 2050 && dayPro >= 110) statusClass = "status-perfect";
          else if (dayCals >= 1500) statusClass = "status-good";
          else statusClass = "status-under";
        }
        cells.push(`
          <div class="heatmap-cell ${statusClass}" 
               data-date="${dStr}" 
               data-cals="${dayCals}" 
               data-pro="${Math.round(dayPro)}"
               data-count="${dayE.length}"
               onmouseenter="showHeatmapTip(event, this)" 
               onmouseleave="hideHeatmapTip()"
               onclick="selectDate('${dStr}');switchTab('log')">
          </div>
        `);
      }
      return cells.join("");
    }

    function showHeatmapTip(e, el) {
      const tip = $("#heatmap-tooltip");
      const d = el.dataset.date;
      const c = el.dataset.cals;
      const p = el.dataset.pro;
      const cnt = el.dataset.count;
      tip.innerHTML = `<strong>${d}</strong><br>${cnt > 0 ? `${c} kcal · ${p}g Protein (${cnt} items)` : 'No entries logged'}`;
      tip.style.display = "block";
      const rect = el.getBoundingClientRect();
      tip.style.left = Math.min(window.innerWidth - 180, Math.max(10, rect.left - 60)) + "px";
      tip.style.top = (rect.top - 50) + "px";
    }
    function hideHeatmapTip() {
      $("#heatmap-tooltip").style.display = "none";
    }

    // ─── WATER VIEW ───
    function viewWater() {
      const dayWater = S.water.filter(w => w.date === S.date);
      const total = dayWater.reduce((a, b) => a + b.ml, 0);
      return `
        <div class="card-box" style="text-align:center;padding:28px 18px">
          <h2 style="font-size:36px;font-weight:800;color:var(--color-water);margin:0 0 4px">${(total/1000).toFixed(2)} L</h2>
          <p style="color:var(--text-secondary);margin:0 0 18px">Daily Target: ${(G.w/1000).toFixed(2)} L (${G.w} ml)</p>
          <div class="water-progress-track" style="height:12px;margin:0 auto 20px;max-width:320px">
            <div class="water-progress-fill" style="width:${Math.min(100, (total/G.w)*100)}%"></div>
          </div>
          <div class="water-pills-row" style="max-width:340px;margin:0 auto">
            <button class="water-pill-btn" onclick="quickAddWater(150)">+150ml</button>
            <button class="water-pill-btn" onclick="quickAddWater(250)">+250ml</button>
            <button class="water-pill-btn" onclick="quickAddWater(350)">+350ml</button>
            <button class="water-pill-btn" onclick="quickAddWater(500)">+500ml</button>
          </div>
        </div>

        <div class="card-box">
          <h2 class="card-heading" style="margin-bottom:12px">💧 Today's Water Log</h2>
          ${dayWater.length ? `
            <ul class="food-item-list">
              ${dayWater.map(w => `
                <li class="food-item-row">
                  <div>
                    <div class="food-name-txt">+${w.ml} ml</div>
                    <div class="food-qty-txt">${w.t || 'Logged'}</div>
                  </div>
                  <button class="btn-delete-item" onclick="deleteWater('${w.id}')">✕</button>
                </li>
              `).join("")}
            </ul>
          ` : `<p style="font-size:13px;color:var(--text-secondary);text-align:center">No water logged today. Tap a quick button above!</p>`}
        </div>
      `;
    }

    // ─── PLAN VIEW ───
    function viewPlan() {
      return `
        <div class="card-box">
          <h2 class="card-heading" style="color:var(--accent-main);margin-bottom:6px">⚡ 1,900 kcal · 120g Protein Blueprint</h2>
          <p style="font-size:12.5px;color:var(--text-secondary);margin:0 0 16px">Custom Indian whole-food plan with 3–4 eggs daily, soya chunks, paneer, and college options.</p>

          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="background:var(--bg-surface-elevated);border-radius:14px;padding:12px">
              <div style="font-weight:800;font-size:14px;margin-bottom:2px">🍳 Breakfast (8:00 AM)</div>
              <div style="font-size:12px;color:var(--color-pro);font-weight:700">~380 kcal · 26g Protein</div>
              <div style="font-size:12.5px;color:var(--text-secondary);margin-top:4px">3 boiled eggs + 2 slices whole wheat bread + chai/black coffee (no sugar).</div>
            </div>

            <div style="background:var(--bg-surface-elevated);border-radius:14px;padding:12px">
              <div style="font-weight:800;font-size:14px;margin-bottom:2px">🍛 Lunch (1:30 PM)</div>
              <div style="font-size:12px;color:var(--color-pro);font-weight:700">~550 kcal · 35g Protein</div>
              <div style="font-size:12.5px;color:var(--text-secondary);margin-top:4px">150g cooked rice + 1 bowl dal + 40g soya chunks or 100g paneer.</div>
            </div>

            <div style="background:var(--bg-surface-elevated);border-radius:14px;padding:12px">
              <div style="font-weight:800;font-size:14px;margin-bottom:2px">🥛 Evening Snack (4:30 PM)</div>
              <div style="font-size:12px;color:var(--color-pro);font-weight:700">~220 kcal · 14g Protein</div>
              <div style="font-size:12.5px;color:var(--text-secondary);margin-top:4px">1 glass toned milk (250ml) or curd + handful roasted chana.</div>
            </div>

            <div style="background:var(--bg-surface-elevated);border-radius:14px;padding:12px">
              <div style="font-weight:800;font-size:14px;margin-bottom:2px">🥗 Dinner (8:15 PM)</div>
              <div style="font-size:12px;color:var(--color-pro);font-weight:700">~500 kcal · 25g Protein</div>
              <div style="font-size:12.5px;color:var(--text-secondary);margin-top:4px">2 rotis + mixed vegetable sabzi + 1 bowl dal + 1 boiled egg.</div>
            </div>
          </div>
        </div>
      `;
    }

    // ─── SERVER DATA SYNC ───
    async function syncFromServer() {
      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";
        const [fe, we, pr] = await Promise.all([
          fetch(`/api/food-entries?date=${S.date}`, { headers: { "x-timezone": tz } }).then(r => r.ok ? r.json() : []),
          fetch(`/api/water?date=${S.date}`, { headers: { "x-timezone": tz } }).then(r => r.ok ? r.json() : { entries: [] }),
          fetch(`/api/profile`).then(r => r.ok ? r.json() : null)
        ]);

        if (pr) {
          if (pr.calorie_target) G.k = Number(pr.calorie_target);
          if (pr.protein_target_g) G.p = Number(pr.protein_target_g);
          if (pr.carb_target_g) G.c = Number(pr.carb_target_g);
          if (pr.fat_target_g) G.f = Number(pr.fat_target_g);
          if (pr.water_target_ml) G.w = Number(pr.water_target_ml);
          if (pr.display_name) G.name = pr.display_name;
        }

        if (Array.isArray(fe)) {
          const mapped = fe.map(e => ({
            id: e.id,
            date: e.local_date,
            meal: e.meal_type,
            name: e.name,
            qty: e.quantity,
            unit: e.unit,
            k: e.calories_kcal,
            p: e.protein_g,
            c: e.carbs_g,
            f: e.fat_g,
            src: e.source || "AI Analysis"
          }));
          S.entries = [...S.entries.filter(e => e.date !== S.date), ...mapped];
        }

        const wList = we.entries || [];
        if (Array.isArray(wList)) {
          const mappedW = wList.map(w => ({
            id: w.id,
            date: w.local_date,
            ml: w.amount_ml,
            t: w.drunk_at ? w.drunk_at.slice(11, 16) : ""
          }));
          S.water = [...S.water.filter(w => w.date !== S.date), ...mappedW];
        }

        renderDayStrip();
        renderMainView();
      } catch (err) {}
    }

    // ─── ACTIONS ───
    async function quickAddWater(ml) {
      const nid = Math.random().toString(36).slice(2);
      const tStr = new Date().toTimeString().slice(0, 5);
      S.water.push({ id: nid, date: S.date, ml, t: tStr });
      renderMainView();
      toast(`+${ml} ml logged 💧`);

      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";
        await fetch("/api/water", {
          method: "POST",
          headers: { "content-type": "application/json", "x-timezone": tz },
          body: JSON.stringify({ amount_ml: ml, drunk_at: `${S.date}T${tStr}:00`, client_request_id: nid })
        });
      } catch (e) {}
    }

    async function deleteWater(id) {
      S.water = S.water.filter(w => w.id !== id);
      renderMainView();
      fetch(`/api/water/${id}`, { method: "DELETE" }).catch(() => {});
    }

    async function deleteEntry(id) {
      S.entries = S.entries.filter(e => e.id !== id);
      renderMainView();
      toast("Meal removed");
      fetch(`/api/food-entries/${id}`, { method: "DELETE" }).catch(() => {});
    }

    function openLogDialogForMeal(m) {
      D.meal = m;
      openLogDialog();
    }

    function openLogDialog() {
      D.rows = [];
      D.text = "";
      D.msg = "";
      renderLogDialogBody();
      $("#dlg-food").showModal();
    }

    function setLogTab(t) {
      D.tab = t;
      $("#tab-log-text").style.background = t === "text" ? "var(--accent-main)" : "var(--bg-subtle)";
      $("#tab-log-text").style.color = t === "text" ? "#ffffff" : "var(--text-primary)";
      $("#tab-log-photo").style.background = t === "photo" ? "var(--accent-main)" : "var(--bg-subtle)";
      $("#tab-log-photo").style.color = t === "photo" ? "#ffffff" : "var(--text-primary)";
      renderLogDialogBody();
    }

    function renderLogDialogBody() {
      const b = $("#log-body");
      if (D.tab === "text") {
        b.innerHTML = `
          <label style="font-size:12px;font-weight:700">Meal Time
            <select id="sel-meal" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-surface-elevated);color:var(--text-primary);margin:4px 0 10px">
              ${MEALS.map(m => `<option value="${m}" ${m === D.meal ? 'selected' : ''}>${ML[m]}</option>`).join("")}
            </select>
          </label>
          <label style="font-size:12px;font-weight:700">Describe what you ate (Indian food supported)
            <textarea id="inp-desc" rows="3" placeholder="e.g. 3 boiled eggs, 2 slices of brown bread, 1 cup chai" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-surface-elevated);color:var(--text-primary);margin-top:4px">${esc(D.text)}</textarea>
          </label>
          <button class="btn-pill-primary" onclick="estimateWithAI()">⚡ Estimate with AI</button>
          ${D.msg ? `<p style="font-size:12px;color:var(--accent-main);margin-top:8px">${esc(D.msg)}</p>` : ''}
          ${renderLogRows()}
        `;
      } else {
        b.innerHTML = `
          <div style="border:2px dashed var(--border-subtle);border-radius:16px;padding:24px;text-align:center;cursor:pointer" onclick="$('#file-inp').click()">
            <input type="file" id="file-inp" accept="image/*" style="display:none" onchange="handlePhotoSelect(event)">
            <div style="font-size:32px">📸</div>
            <div style="font-weight:700;font-size:14px;margin-top:6px">Tap to upload meal photo</div>
            <div style="font-size:12px;color:var(--text-secondary)">AI Vision recognizes Indian dishes & portions</div>
          </div>
          ${D.img ? `<img src="${D.img}" style="width:100%;border-radius:12px;margin-top:10px;max-height:160px;object-fit:cover">` : ''}
          ${D.img ? `<button class="btn-pill-primary" onclick="estimatePhotoWithAI()">⚡ Analyze Photo with Vision AI</button>` : ''}
          ${D.msg ? `<p style="font-size:12px;color:var(--accent-main);margin-top:8px">${esc(D.msg)}</p>` : ''}
          ${renderLogRows()}
        `;
      }
    }

    function renderLogRows() {
      if (!D.rows.length) return "";
      return `
        <div style="margin-top:14px;border-top:1px solid var(--border-subtle);padding-top:10px">
          <div style="font-weight:800;font-size:13px;margin-bottom:8px">Estimated Items (Editable)</div>
          ${D.rows.map((r, i) => `
            <div style="background:var(--bg-surface-elevated);padding:10px;border-radius:10px;margin-bottom:8px;font-size:12.5px">
              <div style="font-weight:700">${esc(r.name)} (${r.qty} ${esc(r.unit)})</div>
              <div style="color:var(--text-secondary);font-size:11.5px">${Math.round(r.k)} kcal · ${Math.round(r.p)}g P · ${Math.round(r.c)}g C · ${Math.round(r.f)}g F</div>
            </div>
          `).join("")}
          <button class="btn-pill-primary" style="background:#10b981" onclick="saveEstimatedItems()">Confirm & Save to Journal</button>
        </div>
      `;
    }

    async function estimateWithAI() {
      const txt = $("#inp-desc").value.trim();
      const meal = $("#sel-meal").value;
      if (!txt) return;
      D.text = txt;
      D.meal = meal;
      D.msg = "Analyzing with AI...";
      renderLogDialogBody();

      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";
        const res = await fetch("/api/nutrition/analyze-text", {
          method: "POST",
          headers: { "content-type": "application/json", "x-timezone": tz },
          body: JSON.stringify({ description: txt, meal_type: meal })
        });
        const j = await res.json();
        if (j.analysis?.items?.length) {
          D.rows = j.analysis.items.map(i => ({
            name: i.name,
            qty: i.quantity,
            unit: i.unit,
            k: i.calories_kcal || 0,
            p: i.protein_g || 0,
            c: i.carbs_g || 0,
            f: i.fat_g || 0
          }));
          D.msg = "";
        } else {
          D.msg = "No foods recognized. Try specific items (e.g. 3 eggs, 2 rotis).";
        }
      } catch (e) {
        D.msg = "Error connecting to AI service.";
      }
      renderLogDialogBody();
    }

    function handlePhotoSelect(e) {
      const f = e.target.files[0];
      if (!f) return;
      D.file = f;
      D.img = URL.createObjectURL(f);
      renderLogDialogBody();
    }

    async function estimatePhotoWithAI() {
      if (!D.file) return;
      D.msg = "Vision AI analyzing meal...";
      renderLogDialogBody();
      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";
        const res = await fetch("/api/nutrition/analyze-image", {
          method: "POST",
          headers: { "content-type": D.file.type, "x-timezone": tz },
          body: D.file
        });
        const j = await res.json();
        if (j.analysis?.items?.length) {
          D.rows = j.analysis.items.map(i => ({
            name: i.name,
            qty: i.quantity,
            unit: i.unit,
            k: i.calories_kcal || 0,
            p: i.protein_g || 0,
            c: i.carbs_g || 0,
            f: i.fat_g || 0
          }));
          D.msg = "";
        } else {
          D.msg = "No foods clearly recognized. Try text prompt.";
        }
      } catch (e) {
        D.msg = "Error analyzing image.";
      }
      renderLogDialogBody();
    }

    async function saveEstimatedItems() {
      const tStr = new Date().toTimeString().slice(0, 5);
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";

      for (const r of D.rows) {
        const nid = Math.random().toString(36).slice(2);
        const item = {
          id: nid,
          date: S.date,
          meal: D.meal,
          name: r.name,
          qty: r.qty,
          unit: r.unit,
          k: r.k,
          p: r.p,
          c: r.c,
          f: r.f,
          src: "AI estimate, confirmed"
        };
        S.entries.push(item);
        fetch("/api/food-entries", {
          method: "POST",
          headers: { "content-type": "application/json", "x-timezone": tz },
          body: JSON.stringify({
            name: item.name,
            quantity: item.qty,
            unit: item.unit,
            meal_type: item.meal,
            calories_kcal: item.k,
            protein_g: item.p,
            carbs_g: item.c,
            fat_g: item.f,
            eaten_at: `${S.date}T${tStr}:00`,
            source: item.src,
            client_request_id: nid
          })
        }).catch(() => {});
      }

      $("#dlg-food").close();
      toast("Meal saved to " + ML[D.meal]);
      renderMainView();
      renderDayStrip();
    }

    // ─── SETTINGS ───
    function openSettingsDialog() {
      $("#inp-cal").value = G.k;
      $("#inp-pro").value = G.p;
      $("#inp-carb").value = G.c;
      $("#inp-fat").value = G.f;
      $("#inp-water").value = G.w;
      $("#dlg-settings").showModal();
    }

    async function savePersonalTargets() {
      G.k = Number($("#inp-cal").value) || G.k;
      G.p = Number($("#inp-pro").value) || G.p;
      G.c = Number($("#inp-carb").value) || G.c;
      G.f = Number($("#inp-fat").value) || G.f;
      G.w = Number($("#inp-water").value) || G.w;

      fetch("/api/profile", {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          calorie_target: G.k,
          protein_target_g: G.p,
          carb_target_g: G.c,
          fat_target_g: G.f,
          water_target_ml: G.w
        })
      }).catch(() => {});

      $("#dlg-settings").close();
      toast("Targets updated!");
      renderMainView();
    }

    // ─── CHAT ───
    let chatOpen = false;
    const chatHistory = [
      { role: "assistant", content: "Hey Gagan! I'm your NutritionX Coach. I know your 1,900 kcal target, 120g protein goal, Indian vegetarian + eggs diet, and what you've logged today. What can I help you with?" }
    ];

    function toggleChat() {
      chatOpen = !chatOpen;
      const p = $("#chat-panel");
      p.hidden = !chatOpen;
      if (chatOpen) renderChatMsgs();
    }

    function renderChatMsgs() {
      const b = $("#chat-msgs");
      b.innerHTML = chatHistory.map(m => `
        <div class="c-msg ${m.role === 'user' ? 'c-user' : 'c-bot'}">
          ${m.role === 'user' ? esc(m.content) : m.content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')}
        </div>
      `).join("");
      b.scrollTop = b.scrollHeight;
    }

    async function handleChatSubmit(e) {
      e.preventDefault();
      const inp = $("#chat-inp");
      const msg = inp.value.trim();
      if (!msg) return;
      inp.value = "";
      chatHistory.push({ role: "user", content: msg });
      renderChatMsgs();

      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "content-type": "application/json", "x-timezone": tz },
          body: JSON.stringify({ message: msg, history: chatHistory.slice(-5) })
        });
        const data = await res.json();
        chatHistory.push({ role: "assistant", content: data.reply || "Keep hitting your 120g protein and water targets Gagan! 💪" });
      } catch (err) {
        chatHistory.push({ role: "assistant", content: "Couldn't reach coach right now. Keep your protein high with eggs, dal, and curd!" });
      }
      renderChatMsgs();
    }

    function toast(msg) {
      const t = $("#toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    // ─── INIT ───
    initTheme();
    renderDayStrip();
    renderMainView();
    syncFromServer();
  </script>
</body>
</html>
